<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Днём Рождения, Эрик!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #5B8731;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 32px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    cursor: crosshair;
    overflow: hidden;
    user-select: none;
  }

  /* Sky blocks at top */
  .sky-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: #6AB0D4;
    border-bottom: 8px solid #3D7BAD;
    z-index: 0;
  }

  /* Ground blocks at bottom */
  .ground-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 56px;
    background: #8B6914;
    border-top: 8px solid #5B4A0F;
    z-index: 0;
  }
  .ground-bar::before {
    content: '';
    position: absolute;
    top: -16px; left: 0; right: 0;
    height: 16px;
    background: #5B8731;
    border-top: 4px solid #3D6B1E;
  }

  .main {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* Title */
  .title {
    text-align: center;
    line-height: 2.2;
    filter: drop-shadow(4px 4px 0 #000);
  }
  .title .line1 {
    display: block;
    font-size: clamp(22px, 5vw, 48px);
    color: #FFEE55;
    text-shadow: 4px 4px 0 #8B7700, -1px -1px 0 #8B7700;
    letter-spacing: 4px;
  }
  .title .line2 {
    display: block;
    font-size: clamp(28px, 6.5vw, 64px);
    color: #FF5555;
    text-shadow: 4px 4px 0 #7A0000, -1px -1px 0 #7A0000;
    letter-spacing: 5px;
    margin-top: 12px;
  }
  .title .line3 {
    display: block;
    font-size: clamp(36px, 8vw, 80px);
    color: #55FF55;
    text-shadow: 5px 5px 0 #005500, -1px -1px 0 #005500;
    letter-spacing: 6px;
    margin-top: 12px;
  }

  /* Steve face - pixel art via CSS */
  .steve-wrap {
    position: relative;
    animation: float 2.8s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .steve {
    image-rendering: pixelated;
    width: 80px;
    height: 80px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border: 2px solid #000;
    box-shadow: 3px 3px 0 #000;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .steve:active { transform: scale(0.93); }

  /* Each cell */
  .px { display: block; }

  /* Row 1 */
  .r1c1 { background: #7B5B3A; }
  .r1c2 { background: #7B5B3A; }
  .r1c3 { background: #7B5B3A; }
  .r1c4 { background: #7B5B3A; }
  .r1c5 { background: #7B5B3A; }
  .r1c6 { background: #7B5B3A; }
  .r1c7 { background: #7B5B3A; }
  .r1c8 { background: #7B5B3A; }
  /* Row 2 */
  .r2c1 { background: #7B5B3A; }
  .r2c2 { background: #C8A882; }
  .r2c3 { background: #C8A882; }
  .r2c4 { background: #C8A882; }
  .r2c5 { background: #C8A882; }
  .r2c6 { background: #C8A882; }
  .r2c7 { background: #C8A882; }
  .r2c8 { background: #7B5B3A; }
  /* Row 3 */
  .r3c1 { background: #7B5B3A; }
  .r3c2 { background: #C8A882; }
  .r3c3 { background: #1A1A1A; } /* left eye */
  .r3c4 { background: #1A1A1A; }
  .r3c5 { background: #C8A882; }
  .r3c6 { background: #1A1A1A; } /* right eye */
  .r3c7 { background: #1A1A1A; }
  .r3c8 { background: #7B5B3A; }
  /* Row 4 */
  .r4c1 { background: #7B5B3A; }
  .r4c2 { background: #C8A882; }
  .r4c3 { background: #5B8FD4; } /* blue eye shine */
  .r4c4 { background: #1A1A1A; }
  .r4c5 { background: #C8A882; }
  .r4c6 { background: #5B8FD4; }
  .r4c7 { background: #1A1A1A; }
  .r4c8 { background: #7B5B3A; }
  /* Row 5 - nose */
  .r5c1 { background: #7B5B3A; }
  .r5c2 { background: #C8A882; }
  .r5c3 { background: #C8A882; }
  .r5c4 { background: #B08060; }
  .r5c5 { background: #B08060; }
  .r5c6 { background: #C8A882; }
  .r5c7 { background: #C8A882; }
  .r5c8 { background: #7B5B3A; }
  /* Row 6 - mouth */
  .r6c1 { background: #7B5B3A; }
  .r6c2 { background: #C8A882; }
  .r6c3 { background: #1A1A1A; }
  .r6c4 { background: #C8A882; }
  .r6c5 { background: #C8A882; }
  .r6c6 { background: #1A1A1A; }
  .r6c7 { background: #C8A882; }
  .r6c8 { background: #7B5B3A; }
  /* Row 7 */
  .r7c1 { background: #7B5B3A; }
  .r7c2 { background: #C8A882; }
  .r7c3 { background: #C8A882; }
  .r7c4 { background: #1A1A1A; }
  .r7c5 { background: #1A1A1A; }
  .r7c6 { background: #C8A882; }
  .r7c7 { background: #C8A882; }
  .r7c8 { background: #7B5B3A; }
  /* Row 8 */
  .r8c1 { background: #7B5B3A; }
  .r8c2 { background: #7B5B3A; }
  .r8c3 { background: #7B5B3A; }
  .r8c4 { background: #7B5B3A; }
  .r8c5 { background: #7B5B3A; }
  .r8c6 { background: #7B5B3A; }
  .r8c7 { background: #7B5B3A; }
  .r8c8 { background: #7B5B3A; }

  .click-hint {
    font-size: 8px;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    opacity: 0.8;
    animation: blink 1.2s step-end infinite;
    margin-top: -12px;
  }
  @keyframes blink { 0%,100%{opacity:0.9} 50%{opacity:0.2} }

  /* Firework canvas */
  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 20;
  }

  /* Floating diamonds */
  .diamonds {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1;
  }
  .diamond {
    position: absolute;
    width: 12px; height: 12px;
    background: #5BE5E5;
    transform: rotate(45deg);
    opacity: 0.4;
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: rotate(45deg) translateY(0)   translateX(0); opacity: 0; }
    10%  { opacity: 0.4; }
    90%  { opacity: 0.4; }
    100% { transform: rotate(45deg) translateY(-100vh) translateX(20px); opacity: 0; }
  }
</style>
</head>
<body>

<div class="sky-bar"></div>
<div class="ground-bar"></div>

<!-- Floating diamonds -->
<div class="diamonds" id="diamonds"></div>

<canvas id="canvas"></canvas>

<div class="main">
  <div class="title">
    <span class="line1">✦ С ДНЁМ ✦</span>
    <span class="line2">РОЖДЕНИЯ</span>
    <span class="line3">ЭРИК!</span>
  </div>
<audio id="birthdayMusic">
  <source src="guitarSong.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("birthdayMusic");

const fadeInTime = 3000;     // 3 секунды появления
const fadeOutTime = 5000;    // 5 секунд затухания
const pauseTime = 60000;     // 1 минута паузы

function fadeIn() {
    music.volume = 0;
    music.play();

    let step = 0.05;
    let interval = fadeInTime / (1 / step);

    let fade = setInterval(() => {
        if (music.volume < 1) {
            music.volume = Math.min(1, music.volume + step);
        } else {
            clearInterval(fade);
        }
    }, interval);
}

function fadeOut(callback) {
    let step = 0.05;
    let interval = fadeOutTime / (1 / step);

    let fade = setInterval(() => {
        if (music.volume > 0) {
            music.volume = Math.max(0, music.volume - step);
        } else {
            clearInterval(fade);
            music.pause();
            callback();
        }
    }, interval);
}

function playBirthday() {
    music.currentTime = 0;
    fadeIn();
}

// Когда музыка почти закончилась — плавно гасим
music.addEventListener("timeupdate", () => {
    if (music.duration - music.currentTime <= fadeOutTime / 1000) {
        fadeOut(() => {
            setTimeout(playBirthday, pauseTime);
        });
    }
});

// Первый запуск
document.addEventListener('click', function startMusic() {
    playBirthday();
    document.removeEventListener('click', startMusic);
});
</script>

  <!-- Steve pixel face -->
  <div class="steve-wrap">
    <div class="steve" id="steve" title="Кликни для салюта!">
      <span class="px r1c1"></span><span class="px r1c2"></span><span class="px r1c3"></span><span class="px r1c4"></span><span class="px r1c5"></span><span class="px r1c6"></span><span class="px r1c7"></span><span class="px r1c8"></span>
      <span class="px r2c1"></span><span class="px r2c2"></span><span class="px r2c3"></span><span class="px r2c4"></span><span class="px r2c5"></span><span class="px r2c6"></span><span class="px r2c7"></span><span class="px r2c8"></span>
      <span class="px r3c1"></span><span class="px r3c2"></span><span class="px r3c3"></span><span class="px r3c4"></span><span class="px r3c5"></span><span class="px r3c6"></span><span class="px r3c7"></span><span class="px r3c8"></span>
      <span class="px r4c1"></span><span class="px r4c2"></span><span class="px r4c3"></span><span class="px r4c4"></span><span class="px r4c5"></span><span class="px r4c6"></span><span class="px r4c7"></span><span class="px r4c8"></span>
      <span class="px r5c1"></span><span class="px r5c2"></span><span class="px r5c3"></span><span class="px r5c4"></span><span class="px r5c5"></span><span class="px r5c6"></span><span class="px r5c7"></span><span class="px r5c8"></span>
      <span class="px r6c1"></span><span class="px r6c2"></span><span class="px r6c3"></span><span class="px r6c4"></span><span class="px r6c5"></span><span class="px r6c6"></span><span class="px r6c7"></span><span class="px r6c8"></span>
      <span class="px r7c1"></span><span class="px r7c2"></span><span class="px r7c3"></span><span class="px r7c4"></span><span class="px r7c5"></span><span class="px r7c6"></span><span class="px r7c7"></span><span class="px r7c8"></span>
      <span class="px r8c1"></span><span class="px r8c2"></span><span class="px r8c3"></span><span class="px r8c4"></span><span class="px r8c5"></span><span class="px r8c6"></span><span class="px r8c7"></span><span class="px r8c8"></span>
    </div>
  </div>

  <div class="click-hint">► КЛИКНИ КУДА УГОДНО ДЛЯ САЛЮТА ◄</div>
</div>

<script>
// === Floating diamonds ===
const diamondsEl = document.getElementById('diamonds');
for (let i = 0; i < 18; i++) {
  const d = document.createElement('div');
  d.className = 'diamond';
  d.style.left = Math.random() * 100 + 'vw';
  d.style.top = Math.random() * 100 + 'vh';
  d.style.animationDuration = (6 + Math.random() * 10) + 's';
  d.style.animationDelay = (Math.random() * 8) + 's';
  d.style.width = d.style.height = (8 + Math.random() * 10) + 'px';
  const colors = ['#5BE5E5','#FFEE55','#FF5555','#55FF55','#FF55FF'];
  d.style.background = colors[Math.floor(Math.random()*colors.length)];
  diamondsEl.appendChild(d);
}

// === Fireworks ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const MINECRAFT_COLORS = [
  '#FF5555','#FFEE55','#55FF55','#55FFFF','#FF55FF',
  '#FFAA00','#AAFFAA','#AAF0FF','#FFAAFF','#FFFFFF',
  '#5BE5E5','#FF9900','#00FF77'
];

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.0045;
    // Pixel size — Minecraft style squares
    this.size = 4 + Math.floor(Math.random() * 5);
    this.gravity = 0.12;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += this.gravity;
    this.vx *= 0.97;
    this.life -= this.decay;
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    // Pixelated square particles
    const s = this.size;
    ctx.fillRect(Math.round(this.x - s/2), Math.round(this.y - s/2), s, s);
  }
}

class Rocket {
  constructor(x, y) {
    this.x = x;
    this.y = canvas.height;
    this.tx = x;
    this.ty = y;
    this.vy = -18 - Math.random() * 6;
    this.color = MINECRAFT_COLORS[Math.floor(Math.random() * MINECRAFT_COLORS.length)];
    this.trail = [];
    this.exploded = false;
  }
  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 8) this.trail.shift();
    this.vy += 0.4;
    this.y += this.vy;
    if (this.vy >= 0 || this.y <= this.ty) {
      this.explode();
    }
  }
  explode() {
    this.exploded = true;
    const count = 240 + Math.floor(Math.random() * 160);
    const burstColor = MINECRAFT_COLORS[Math.floor(Math.random() * MINECRAFT_COLORS.length)];
    const burstColor2 = MINECRAFT_COLORS[Math.floor(Math.random() * MINECRAFT_COLORS.length)];
    for (let i = 0; i < count; i++) {
      const c = Math.random() > 0.5 ? burstColor : burstColor2;
      particles.push(new Particle(this.x, this.y, c));
    }
  }
  draw() {
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const alpha = i / this.trail.length * 0.6;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = this.color;
      ctx.fillRect(Math.round(this.trail[i].x - 2), Math.round(this.trail[i].y - 2), 4, 4);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(Math.round(this.x - 3), Math.round(this.y - 3), 6, 6);
  }
}

let particles = [];
let rockets = [];

function launchFirework(x, y) {
  const targetY = y * 0.3 + Math.random() * y * 0.4;
  rockets.push(new Rocket(x, targetY));
}

document.addEventListener('click', (e) => {
  launchFirework(e.clientX, e.clientY);
  // Burst of 2-3 at click point
  const extra = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < extra; i++) {
    setTimeout(() => {
      launchFirework(
        e.clientX + (Math.random() - 0.5) * 120,
        e.clientY
      );
    }, i * 180);
  }
});

// Steve wiggle on click
document.getElementById('steve').addEventListener('click', (e) => {
  e.stopPropagation();
  launchFirework(e.clientX, e.clientY);
  launchFirework(window.innerWidth * 0.3, e.clientY);
  launchFirework(window.innerWidth * 0.7, e.clientY);
});

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 1;

  rockets = rockets.filter(r => {
    if (!r.exploded) { r.update(); r.draw(); return true; }
    return false;
  });

  particles = particles.filter(p => {
    p.update();
    if (p.life > 0) { p.draw(); return true; }
    return false;
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
